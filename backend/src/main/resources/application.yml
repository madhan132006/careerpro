server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: AI Career Guidance Agent

  # ---------------------------------------------------------------
  # Using H2 In-Memory Database to completely bypass MySQL passwords!
  # ---------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:careerpro_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com       # <-- Replace with your Gmail
    password: your-app-password          # <-- Replace with Gmail App Password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000       # 24 hours in milliseconds
  refresh-expiration: 604800000  # 7 days in milliseconds

# Gemini AI Configuration
gemini:
  api:
    key: your-gemini-api-key   # <-- Replace with your actual Gemini API key
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
    model: gemini-1.5-flash
    max-tokens: 8192
    temperature: 0.7

# File Upload
file:
  upload:
    dir: uploads

# Swagger / OpenAPI UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# CORS - allow frontend origins
cors:
  allowed-origins: http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

# Logging
logging:
  level:
    root: INFO
    com.careerpro: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Management / Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
