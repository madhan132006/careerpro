<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CareerPro AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* ── Full-screen AI background ── */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;

            /* Background image */
            background-image: url('../assets/login-bg.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;

            /* Smooth fade-in */
            animation: bgFadeIn 1s ease forwards;
        }

        @keyframes bgFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Light blue gradient overlay — bright and airy */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(239, 246, 255, 0.75) 0%,
                rgba(219, 234, 254, 0.60) 40%,
                rgba(237, 233, 254, 0.55) 100%
            );
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
            z-index: 0;
        }

        /* Push content above overlay */
        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
        }

        /* ── Login card — UNCHANGED ── */
        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo {
            width: 48px;
            height: 48px;
            background: var(--gradient-primary);
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 16px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .auth-card { padding: 28px 18px; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="auth-container">
        <div class="auth-card animate-fadeInUp">
            <div class="auth-header">
                <div class="auth-logo"><i class="bi bi-robot"></i></div>
                <h2 style="font-size: 1.75rem; margin-bottom: 8px;">Welcome Back</h2>
                <p class="text-muted">Sign in to continue your career journey.</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                </div>
                
                <div class="form-group">
                    <div class="flex justify-between items-center mb-2">
                        <label class="form-label" style="margin: 0;">Password</label>
                        <a href="forgot-password.html" class="text-sm text-primary font-semibold">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-group mb-4 flex items-center gap-2">
                    <input type="checkbox" id="rememberMe" style="accent-color: var(--primary); width: 16px; height: 16px;">
                    <label for="rememberMe" class="text-sm m-0 cursor-pointer text-muted">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
                    Sign In <i class="bi bi-box-arrow-in-right"></i>
                </button>
            </form>

            <div class="text-center mt-6 text-sm text-muted">
                Don't have an account? <a href="register.html" class="text-primary font-semibold">Register here</a>
            </div>
            
            <!-- Default Admin Creds for testing -->
            <div class="mt-4 p-3 bg-gray-100 rounded text-xs text-center text-gray-500" style="background:var(--gray-50); border:1px dashed var(--gray-300);">
                <strong>Admin Test:</strong> admin@careerpro.ai / Admin@123
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Pre-fill remembered email
            const savedEmail = localStorage.getItem('careerpro_saved_email');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('rememberMe').checked = true;
            }
            // If already logged in, skip login page
            if (localStorage.getItem('careerpro_token')) {
                const role = localStorage.getItem('careerpro_user_role');
                window.location.replace(role === 'ROLE_ADMIN' ? 'admin-dashboard.html' : 'dashboard.html');
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('submit-btn');
            const emailVal = document.getElementById('email').value.trim();
            const passwordVal = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            // Basic client-side validation
            if (!emailVal || !passwordVal) {
                alert('Please enter both email and password.');
                return;
            }

            // Save/clear remembered email
            if (rememberMe) {
                localStorage.setItem('careerpro_saved_email', emailVal);
            } else {
                localStorage.removeItem('careerpro_saved_email');
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner" style="width:20px;height:20px;border-width:2px;display:inline-block;margin-right:8px;"></span> Signing in...';

                // Call Spring Boot API
                const result = await api.post('/auth/login', { email: emailVal, password: passwordVal });

                if (result.success) {
                    // ── Save JWT and user info to localStorage ──
                    auth.setSession(result.data);

                    // Show success
                    if (typeof ui !== 'undefined') {
                        ui.showToast('Login Successful!');
                    } else {
                        alert('Login Successful!');
                    }

                    // ── Redirect to Dashboard ──
                    setTimeout(() => {
                        if (result.data.role === 'ROLE_ADMIN') {
                            window.location.replace('admin-dashboard.html');
                        } else {
                            window.location.replace('dashboard.html');
                        }
                    }, 600);

                } else {
                    // Login failed — show server error message
                    const errMsg = result.message || 'Invalid email or password.';
                    if (typeof ui !== 'undefined') {
                        ui.showToast(errMsg, 'error');
                    } else {
                        alert(errMsg);
                    }
                    btn.disabled = false;
                    btn.innerHTML = 'Sign In <i class="bi bi-box-arrow-in-right"></i>';
                }

            } catch (error) {
                // Network error or backend down
                const errMsg = error.message || 'Unable to connect to the server.';
                if (typeof ui !== 'undefined') {
                    ui.showToast(errMsg, 'error');
                } else {
                    alert(errMsg);
                }
                btn.disabled = false;
                btn.innerHTML = 'Sign In <i class="bi bi-box-arrow-in-right"></i>';
            }
        });
    </script>
</body>
</html>
