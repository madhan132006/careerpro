<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CareerPro AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="light">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand-icon" style="background: linear-gradient(135deg, #0f172a, #334155);"><i class="bi bi-shield-lock"></i></div>
            <span style="font-weight: 800; font-size: 1.1rem; color: var(--text-primary);">Admin Panel</span>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-section-title">Administration</div>
            <a href="admin-dashboard.html" class="sidebar-link active">
                <span class="link-icon"><i class="bi bi-speedometer2"></i></span> Analytics
            </a>
            <a href="#" class="sidebar-link" onclick="ui.showToast('User Management section coming soon', 'info')">
                <span class="link-icon"><i class="bi bi-people"></i></span> Users
            </a>
            <a href="#" class="sidebar-link" onclick="ui.showToast('System Settings section coming soon', 'info')">
                <span class="link-icon"><i class="bi bi-gear"></i></span> Settings
            </a>
        </nav>
        
        <div style="padding: 16px; border-top: 1px solid var(--border-color);">
            <div class="flex items-center gap-3 mb-4">
                <div class="avatar" style="width: 40px; height: 40px; font-size: 0.9rem; background: #0f172a;">AD</div>
                <div style="flex:1;">
                    <div class="text-sm font-semibold user-display-name">Admin</div>
                    <div class="text-xs text-error">Superuser</div>
                </div>
            </div>
            <button id="logout-btn" class="btn btn-secondary btn-full btn-sm">
                <i class="bi bi-box-arrow-right"></i> Logout
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 class="page-title">System Overview</h1>
                <p class="page-subtitle">Real-time platform metrics and user analytics.</p>
            </div>
            <button id="theme-toggle" class="theme-toggle"><i class="bi bi-moon-stars-fill"></i></button>
        </header>

        <div class="grid grid-4 mb-6">
            <div class="stat-card">
                <div class="stat-icon blue"><i class="bi bi-people-fill"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-users">--</div>
                    <div class="stat-label">Total Users</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple"><i class="bi bi-magic"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-recs">--</div>
                    <div class="stat-label">AI Predictions</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green"><i class="bi bi-file-earmark-pdf"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-resumes">--</div>
                    <div class="stat-label">Resumes Analyzed</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange"><i class="bi bi-chat-left-text"></i></div>
                <div class="stat-info">
                    <div class="stat-value" id="stat-feedbacks">--</div>
                    <div class="stat-label">Open Tickets</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg">Recent Users</h3>
                <button class="btn btn-sm btn-secondary" onclick="loadAdminData()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
            </div>
            <div class="overflow-hidden">
                <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-secondary);">
                            <th style="padding: 12px 8px;">ID</th>
                            <th style="padding: 12px 8px;">Name</th>
                            <th style="padding: 12px 8px;">Email</th>
                            <th style="padding: 12px 8px;">Role</th>
                            <th style="padding: 12px 8px;">Status</th>
                            <th style="padding: 12px 8px; text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <tr><td colspan="6" class="text-center py-6 text-muted">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(!auth.isAdmin()) {
                window.location.href = 'dashboard.html';
                return;
            }
            loadAdminData();
        });

        async function loadAdminData() {
            try {
                const res = await api.get('/admin/dashboard');
                if(res.success) {
                    const data = res.data;
                    document.getElementById('stat-users').textContent = data.totalUsers;
                    document.getElementById('stat-recs').textContent = data.totalRecommendations;
                    document.getElementById('stat-resumes').textContent = data.totalResumesAnalyzed;
                    document.getElementById('stat-feedbacks').textContent = data.openFeedbacks;
                }

                const usersRes = await api.get('/admin/users');
                if(usersRes.success) {
                    renderUsers(usersRes.data);
                }
            } catch(err) {
                ui.showToast(err.message, 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            if(users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No users found.</td></tr>';
                return;
            }

            users.forEach(u => {
                const statusBadge = u.isActive 
                    ? '<span class="badge badge-success">Active</span>' 
                    : '<span class="badge badge-error">Inactive</span>';
                
                const roleBadge = u.role === 'ROLE_ADMIN' 
                    ? '<span class="badge badge-purple">Admin</span>' 
                    : '<span class="badge badge-primary">User</span>';

                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--border-color)';
                tr.innerHTML = `
                    <td style="padding: 12px 8px;">#${u.id}</td>
                    <td style="padding: 12px 8px; font-weight: 500;">${u.fullName}</td>
                    <td style="padding: 12px 8px; color: var(--text-secondary);">${u.email}</td>
                    <td style="padding: 12px 8px;">${roleBadge}</td>
                    <td style="padding: 12px 8px;">${statusBadge}</td>
                    <td style="padding: 12px 8px; text-align:right;">
                        ${u.role !== 'ROLE_ADMIN' ? `
                        <button class="btn btn-sm ${u.isActive ? 'btn-secondary' : 'btn-primary'}" onclick="toggleStatus(${u.id})" style="padding: 4px 8px; font-size: 0.75rem;">
                            ${u.isActive ? 'Deactivate' : 'Activate'}
                        </button>
                        <button class="btn btn-sm" style="background:var(--error); color:white; padding: 4px 8px;" onclick="deleteUser(${u.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                        ` : '<span class="text-muted text-xs">Superuser</span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleStatus(id) {
            try {
                const res = await api.patch(`/admin/users/${id}/status`);
                if(res.success) {
                    ui.showToast(res.message);
                    loadAdminData();
                }
            } catch(e) { ui.showToast(e.message, 'error'); }
        }

        async function deleteUser(id) {
            if(!confirm('Are you sure you want to delete this user? All associated data will be lost.')) return;
            try {
                const res = await api.delete(`/admin/users/${id}`);
                if(res.success) {
                    ui.showToast(res.message);
                    loadAdminData();
                }
            } catch(e) { ui.showToast(e.message, 'error'); }
        }
    </script>
</body>
</html>
