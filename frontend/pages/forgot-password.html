<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CareerPro AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-theme="light">

    <div class="auth-container">
        <div class="auth-card animate-fadeInUp">
            <div class="auth-header">
                <a href="../index.html" class="brand-icon mx-auto mb-4" style="display:flex; align-items:center; justify-content:center; text-decoration:none;">
                    <i class="bi bi-robot"></i>
                </a>
                <h2 style="font-size: 1.75rem; margin-bottom: 8px;">Forgot Password</h2>
                <p class="text-muted">Enter your email and we'll send you a reset link.</p>
            </div>

            <div id="success-msg" class="hidden p-4 rounded-md mb-4 text-center" style="background: rgba(16,185,129,0.1); border: 1px solid var(--success); color: var(--success);">
                <i class="bi bi-check-circle-fill mr-2"></i>
                Password reset instructions have been sent to your email.
            </div>

            <form id="forgot-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full mt-4" id="submit-btn">
                    Send Reset Link <i class="bi bi-send"></i>
                </button>
            </form>

            <div class="text-center mt-6 text-sm text-muted">
                Remember your password? <a href="login.html" class="text-primary font-semibold">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const email = document.getElementById('email').value.trim();

            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;display:inline-block;margin-right:8px;"></span> Sending...';

                await api.post('/auth/forgot-password', { email });
                document.getElementById('success-msg').classList.remove('hidden');
                document.getElementById('forgot-form').classList.add('hidden');
            } catch (err) {
                // Show success even on error (security best practice - don't reveal if email exists)
                document.getElementById('success-msg').classList.remove('hidden');
                document.getElementById('forgot-form').classList.add('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Reset Link <i class="bi bi-send"></i>';
            }
        });
    </script>
</body>
</html>
